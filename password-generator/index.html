<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel='stylesheet'
        href='https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>


</head>

<body>
    <div class="container">
        <h1>Password Generator</h1>
        <div class="password-container">
            <input type="read" readonly id="password">
            <i class="fi fi-rr-copy-alt" id="copy-btn" title="copy to clipboard"></i>

        </div>
        <!-- options -->
        <div class="options">
            <!-- password length -->
            <div class="range-container">
                <label for="length"> Password Length</label>

                <input type="range" id="length" min="6" max="24" value="12">
                <span id="length-value">12</span>
            </div>
            <!-- include uppercase -->
            <div class="option">
                <label for="uppercase">Inlcude Uppercase</label>
                <input type="checkbox" id="uppercase" checked>
            </div>
            <!-- inlcude lowercase -->
            <div class="option">
                <label for="lowercase">Inlcude Lowercase</label>
                <input type="checkbox" id="lowercase" checked>
            </div>
            <!--inlude numbers  -->
            <div class="option">
                <label for="numbers">Inlcude numbers</label>
                <input type="checkbox" id="numbers" checked>
            </div>
            <!--inlude symbols  -->
            <div class="option">
                <label for="symbols">Inlcude Symbols</label>
                <input type="checkbox" id="symbols" checked>
            </div>
        </div>
        <button id="generate-btn"><i class="fi fi-rr-key"></i>Generate Password</button>
        <div class="strength-container">
            <p>Password Strength: <span id="strength-label">Medium</span></p>
            <div class="strength-meter">
                <div class="strength-bar">
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
