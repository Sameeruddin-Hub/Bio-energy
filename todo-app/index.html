<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo app</title>
    <link rel="stylesheet" href="style.css">
    <link rel='stylesheet'
        href='https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel='stylesheet'
        href='https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-chubby/css/uicons-regular-chubby.css'>
    <link rel='stylesheet'
        href='https://cdn-uicons.flaticon.com/4.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css'>
    <link rel='stylesheet'
        href='https://cdn-uicons.flaticon.com/4.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css'>
</head>

<body>
    <div class="app">
        <header>
            <h1>
                <i class="fi fi-rr-check-circle"></i>
                My Task
            </h1>
            <p id="date"></p>
        </header>
        <div class="todo-input">
            <input type="text" id="task-input" placeholder="What do you want to do ?">
            <button id="add-task">
                <i class="fi fi-rr-plus"></i>
            </button>
        </div>
        <div class="filters">
            <span class="filter active" data-filter="all">All</span>
            <span class="filter " data-filter="active">Active</span>
            <span class="filter " data-filter="completed">Completed</span>

        </div>

        <div class="todos-container">
            <ul id="todos-list">
                <!-- Todo items will be dynamically added here -->
                <!-- <li class="todo-item">
                    <label class="checkbox-container">
                        <input type="checkbox" class="todo-checkbox">
                        <span class="checkmark"></span>
                    </label>
                    <span class="todo-item-text">Buy groceries</span>
                    <button class="delete-btn">
                        <i class="fi fi-rr-trash"></i>
                    </button>

                </li> -->
            </ul>
            <!-- <div class="empty-state ">
                <i class="fi fi-rr-folder-open"></i>
                <p>No tasks yet. Add a task to get started!</p>
            </div> -->
        </div>
        <footer>
            <p id="items-left"> 0 items left</p>
            <button id="clear-completed">Clear Completed</button>
        </footer>
        <script src="script.js"></script>
</body>

</html>
